<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#333"/>
    </marker>
    <style>
      .lane-title { font-size: 18px; font-weight: 700; fill: #111; }
      .box { fill: #f8f9fa; stroke: #333; stroke-width: 1.5; rx: 8; }
      .box-patient { fill: #e8f4fc; }
      .box-backend { fill: #f0f0f0; }
      .box-clinician { fill: #e8f8ee; }
      .label { font-size: 13px; fill: #222; text-anchor: middle; }
      .lane-bg-patient { fill: #f5fafd; stroke: #bbb; stroke-width: 1; }
      .lane-bg-backend { fill: #fafafa; stroke: #bbb; stroke-width: 1; }
      .lane-bg-clinician { fill: #f5fbf7; stroke: #bbb; stroke-width: 1; }
      .db { fill: #fff; stroke: #333; stroke-width: 1.5; }
      .line { stroke: #333; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .title { font-size: 22px; font-weight: 700; fill: #111; text-anchor: middle; }
    </style>
  </defs>

  <text x="600" y="36" class="title">PostCareAI  System Architecture</text>

  <!-- Patient UI lane -->
  <rect x="40" y="60" width="1120" height="140" class="lane-bg-patient" rx="6"/>
  <text x="70" y="90" class="lane-title">Patient UI</text>

  <rect x="120" y="105" width="110" height="44" class="box box-patient"/>
  <text x="175" y="132" class="label">Check-in</text>

  <rect x="280" y="105" width="150" height="44" class="box box-patient"/>
  <text x="355" y="132" class="label">Meds  localStorage</text>

  <rect x="480" y="105" width="160" height="44" class="box box-patient"/>
  <text x="560" y="132" class="label">Recovery dashboard</text>

  <rect x="700" y="105" width="120" height="44" class="box box-patient"/>
  <text x="760" y="132" class="label">Chat  RAG</text>

  <!-- Backend lane -->
  <rect x="40" y="220" width="1120" height="280" class="lane-bg-backend" rx="6"/>
  <text x="70" y="250" class="lane-title">Backend</text>

  <rect x="80" y="290" width="150" height="44" class="box box-backend"/>
  <text x="155" y="310" class="label" style="font-size:11px">POST /patient/case</text>
  <text x="155" y="324" class="label" style="font-size:10px;fill:#555">/api/patients/upload</text>

  <rect x="270" y="290" width="110" height="44" class="box box-backend"/>
  <text x="325" y="317" class="label">MedSigLIP</text>

  <rect x="420" y="290" width="110" height="44" class="box box-backend"/>
  <text x="475" y="317" class="label">Safety rules</text>

  <rect x="570" y="275" width="220" height="74" class="box box-backend"/>
  <text x="680" y="305" class="label">Triage / Patient /</text>
  <text x="680" y="325" class="label">Clinician agents</text>
  <text x="680" y="342" class="label" style="font-size:10px;fill:#555">(+ PostCare-Gemini)</text>

  <!-- SQLite cylinder -->
  <ellipse cx="920" cy="308" rx="70" ry="14" class="db"/>
  <rect x="850" y="308" width="140" height="70" class="db"/>
  <ellipse cx="920" cy="378" rx="70" ry="14" class="db"/>
  <text x="920" y="350" class="label">SQLite</text>

  <!-- Chat path -->
  <rect x="680" y="400" width="200" height="44" class="box box-backend"/>
  <text x="780" y="420" class="label" style="font-size:11px">POST /patient/case/</text>
  <text x="780" y="434" class="label" style="font-size:11px">{id}/chat</text>

  <rect x="920" y="400" width="120" height="44" class="box box-backend"/>
  <text x="980" y="417" class="label" style="font-size:11px">Vector store</text>
  <text x="980" y="432" class="label" style="font-size:10px;fill:#555">(RAG index)</text>

  <!-- Clinician UI lane -->
  <rect x="40" y="520" width="1120" height="120" class="lane-bg-clinician" rx="6"/>
  <text x="70" y="550" class="lane-title">Clinician UI</text>

  <rect x="420" y="565" width="200" height="44" class="box box-clinician"/>
  <text x="520" y="592" class="label">Case table + Review</text>

  <!-- Arrows Patient UI -->
  <path d="M 175 149 L 155 290" class="line"/>
  <path d="M 560 149 L 900 308" class="line"/>
  <path d="M 760 149 L 780 400" class="line"/>

  <!-- Arrows Backend pipeline -->
  <path d="M 230 312 L 270 312" class="line"/>
  <path d="M 380 312 L 420 312" class="line"/>
  <path d="M 530 312 L 570 312" class="line"/>
  <path d="M 790 312 L 850 340" class="line"/>

  <!-- Chat to vector + sqlite -->
  <path d="M 880 422 L 920 422" class="line"/>
  <path d="M 780 444 L 780 470 L 920 470 L 920 378" class="line" style="marker-end:url(#arrow)"/>

  <!-- SQLite to Clinician -->
  <path d="M 920 422 L 920 500 L 520 500 L 520 565" class="line"/>
</svg>
