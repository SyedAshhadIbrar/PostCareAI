# Run 1 — baseline experiment (underfitting)
# Inference scores clustered 0.45–0.59; model still improving at epoch 5.
# Total optimizer steps: 40 (8 steps/epoch × 5 epochs)

run:
  name: run1-underfitting-baseline
  description: >
    Initial SurgWound fine-tune with limited trainable capacity and few optimizer
    steps. Demonstrated clear underfitting — kept as baseline for Run 2 comparison.
  parent_run: null
  tags:
    stage: baseline
    outcome: underfitting
  output_dir: outputs/medsiglip-448-surgwound-v1

model:
  id: google/medsiglip-448
  n_unfreeze: 4

data:
  dataset_name: SurgWound
  expected_splits:
    train: 480
    validation: 69
    test: 137
  pos_weight: [1.42, 2.59, 6.56, 5.15, 7.42, 5.24]

training:
  batch_size: 4
  grad_accum: 16
  epochs: 5
  differential_lr: false
  learning_rate: 5.0e-5
  warmup_steps: 10
  weight_decay: 0.01
  scheduler: cosine
  fp16: true
  logging_steps: 1
  save_total_limit: 3
  dataloader_num_workers: 2
  metric_for_best_model: eval_loss

evaluation:
  threshold_strategy: fixed
  fixed_threshold: 0.5

mlflow:
  experiment_name: medsiglip-surgwound
  tracking_uri: ./mlruns
